name: ledgerpay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerpay
      POSTGRES_USER: ledgerpay
      POSTGRES_PASSWORD: ledgerpay
    ports:
      - "${LEDGERPAY_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerpay -d ledgerpay"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ledgerpay-postgres:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerpay
      SPRING_DATASOURCE_USERNAME: ledgerpay
      SPRING_DATASOURCE_PASSWORD: ledgerpay
      LEDGERPAY_JWT_SECRET: local-docker-only-ledgerpay-jwt-secret-32b
    ports:
      - "8080:8080"

volumes:
  ledgerpay-postgres:
